[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lizard-delta"
version = "0.2.1"
description = "Delta-aware cyclomatic complexity reporting for GitLab Code Quality"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Alan Fischer" }]
requires-python = ">=3.8"
dependencies = ["lizard"]

[project.urls]
Repository = "https://github.com/alanfischer/lizard-delta"

[project.scripts]
lizard-base = "lizard_delta.lizard_base:main"
lizard-to-code-quality = "lizard_delta.lizard_to_code_quality:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lizard_delta"]
